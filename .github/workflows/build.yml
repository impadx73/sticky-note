name: Build macOS app & DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sticky Note.app and .dmg
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build app bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build.sh

      - name: Create DMG
        run: ./scripts/make-dmg.sh

      - name: Smoke test (bundle structure)
        run: |
          plutil -lint "dist/Sticky Note.app/Contents/Info.plist"
          test -f "dist/Sticky Note.app/Contents/Resources/AppIcon.icns"
          hdiutil verify dist/*.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickyNote-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
