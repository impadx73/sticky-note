name: Build macOS app & DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (Apple Silicon runners sometimes queue for a long time; Intel ones are a good fallback)"
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel

permissions:
  contents: write

jobs:
  build:
    name: Build Sticky Note.app and .dmg
    runs-on: ${{ github.event.inputs.runner || 'macos-latest' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build app bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build.sh

      - name: Create DMG
        run: ./scripts/make-dmg.sh

      - name: Smoke test (bundle structure)
        run: |
          plutil -lint "dist/Sticky Note.app/Contents/Info.plist"
          test -f "dist/Sticky Note.app/Contents/Resources/AppIcon.icns"
          hdiutil verify dist/*.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickyNote-dmg
          path: dist/*.dmg
          if-no-files-found: error

      # Keeps a copy of every DMG on the "dist" branch so there is always a
      # plain download link, even without a GitHub Release:
      #   https://github.com/impadx73/sticky-note/raw/dist/StickyNote-latest.dmg
      - name: Publish DMG to the dist branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG="$(ls dist/*.dmg | head -n 1)"
          NAME="$(basename "$DMG")"
          WORK="$RUNNER_TEMP/dist-branch"
          publish() {
            rm -rf "$WORK"
            mkdir -p "$WORK"
            cd "$WORK"
            git init -q
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git fetch -q --depth 1 origin dist 2>/dev/null; then
              git checkout -q -b dist FETCH_HEAD
            else
              git checkout -q --orphan dist
            fi
            cp "$GITHUB_WORKSPACE/$DMG" "./$NAME"
            cp "$GITHUB_WORKSPACE/$DMG" "./StickyNote-latest.dmg"
            {
              echo "# Sticky Note – built DMG files"
              echo
              echo "Built automatically by GitHub Actions from \`main\`. Latest: [StickyNote-latest.dmg](StickyNote-latest.dmg)"
              echo
              echo "| File | Commit | Run | Runner | Built (UTC) |"
              echo "| --- | --- | --- | --- | --- |"
              echo "| $NAME | ${GITHUB_SHA::7} | ${GITHUB_RUN_NUMBER} | $(uname -m) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            } > README.md
            git add -A
            git commit -q -m "Build $NAME from ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER}, $(uname -m))" || echo "Nothing to commit"
            git push -q origin dist
          }
          # Two builds may finish close together; retry if the push races.
          for attempt in 1 2 3; do
            if publish; then exit 0; fi
            echo "Publish attempt $attempt failed, retrying…"
            sleep 10
          done
          exit 1

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
